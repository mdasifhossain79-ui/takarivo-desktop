<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Takarivo</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <div class="auth-page">
        <div class="card auth-card">
            <div class="auth-logo">Takarivo</div>
            <p class="auth-subtitle">Create your account</p>

            <div class="form-banner error" id="register-error"></div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="register-name">Full Name</label>
                    <input class="form-input" type="text" id="register-name" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="register-email">Email</label>
                    <input class="form-input" type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="register-password">Password</label>
                    <input class="form-input" type="password" id="register-password" required minlength="8">
                </div>
                <div class="form-group">
                    <label class="form-label" for="register-confirm">Confirm Password</label>
                    <input class="form-input" type="password" id="register-confirm" required minlength="8">
                </div>
                <div class="form-group">
                    <label class="flex gap-sm" style="font-size: var(--font-size-sm);">
                        <input type="checkbox" id="agree-terms" required>
                        I agree to the Terms of Service and Privacy Policy
                    </label>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>

            <p class="auth-footer-link">Already have an account? <a href="login.html">Sign In</a></p>
        </div>
    </div>

    <script src="../js/authStorage.js"></script>
    <script src="../js/auth.js"></script>  
</body>
</html>
