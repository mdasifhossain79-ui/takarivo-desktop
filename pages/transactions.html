<!DOCTYPE html>
<html lang="en" class="auth-checking">
<head>
    <script src="../js/authGuard.js"></script>
    <script>document.documentElement.classList.remove("auth-checking");</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions — Takarivo</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <div class="sidebar-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">Takarivo</div>
            <a class="sidebar-link" href="dashboard.html">Dashboard</a>
            <a class="sidebar-link" href="accounts.html">Accounts</a>
            <a class="sidebar-link" href="transactions.html">Transactions</a>
            <a class="sidebar-link" href="cards.html">Cards</a>
            <a class="sidebar-link" href="budgets.html">Budgets</a>
            <a class="sidebar-link" href="goals.html">Goals</a>
            <a class="sidebar-link" href="reports.html">Reports</a>
            <a class="sidebar-link" href="settings.html">Settings</a>
            <a class="sidebar-link" href="help.html">Help</a>
        </aside>

        <div class="main-content">
            <header class="app-header">
                <button class="menu-toggle btn btn-secondary">☰</button>
                <h2>Transactions</h2>
                <button id="logout-btn" class="btn">Logout</button>
            </header>

            <div class="page-body">
                <div class="flex-between mb-lg">
                    <p>All your income and expenses.</p>
                    <button class="btn btn-primary" id="add-transaction-btn">+ Add Transaction</button>
                </div>

                <div class="grid grid-auto mb-lg">
                    <div class="card kpi-card">
                        <div class="kpi-label">Income</div>
                        <div class="kpi-value kpi-positive" id="sum-income">৳0</div>
                    </div>
                    <div class="card kpi-card">
                        <div class="kpi-label">Expenses</div>
                        <div class="kpi-value kpi-negative" id="sum-expenses">৳0</div>
                    </div>
                    <div class="card kpi-card">
                        <div class="kpi-label">Net Cash Flow</div>
                        <div class="kpi-value" id="sum-net">৳0</div>
                    </div>
                </div>

                <div class="card mb-lg" id="transaction-form-card" hidden style="max-width: 480px;">
                    <h3 class="mb-md" id="transaction-form-title">Add Transaction</h3>
                    <div class="form-banner error" id="transaction-form-error"></div>

                    <form id="transaction-form">
                        <div class="form-group">
                            <label class="form-label" for="txn-account">Account</label>
                            <select class="form-input" id="txn-account" required></select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="txn-date">Date</label>
                            <input class="form-input" type="date" id="txn-date" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="txn-description">Description</label>
                            <input class="form-input" type="text" id="txn-description" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="txn-category">Category</label>
                            <input class="form-input" type="text" id="txn-category" list="category-options" required>
                            <datalist id="category-options">
                                <option value="Salary"></option>
                                <option value="Freelance"></option>
                                <option value="Food"></option>
                                <option value="Utilities"></option>
                                <option value="Transport"></option>
                                <option value="Entertainment"></option>
                                <option value="Other"></option>
                            </datalist>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="txn-type">Type</label>
                            <select class="form-input" id="txn-type">
                                <option value="expense">Expense</option>
                                <option value="income">Income</option>
                                <option value="transfer">Transfer</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="txn-amount">Amount (৳)</label>
                            <input class="form-input" type="number" step="0.01" min="0.01" id="txn-amount" required>
                        </div>
                        <div class="flex gap-md">
                            <button type="submit" class="btn btn-primary">Save</button>
                            <button type="button" class="btn btn-secondary" id="transaction-cancel-btn">Cancel</button>
                        </div>
                    </form>
                </div>

                <div class="card">
                    <div class="flex-between mb-md">
                        <h3>Transactions</h3>
                        <select class="form-input" id="type-filter" style="width: auto;">
                            <option value="all">All types</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                            <option value="transfer">Transfer</option>
                        </select>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Account</th>
                                <th>Category</th>
                                <th>Type</th>
                                <th>Amount</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-table-body"></tbody>
                    </table>
                </div>

        </div>
    </div>

    <script src="../js/authStorage.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/transactions.js"></script>
</body>
</html>
