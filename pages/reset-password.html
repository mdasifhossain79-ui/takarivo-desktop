<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Takarivo</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <div class="auth-page">
        <div class="card auth-card">
            <div class="auth-logo">Takarivo</div>
            <p class="auth-subtitle">Choose a new password</p>

            <div class="form-banner error" id="reset-error"></div>

            <form id="reset-form">
                <div class="form-group">
                    <label class="form-label" for="reset-token">Reset Token</label>
                    <input class="form-input" type="text" id="reset-token" required placeholder="Paste your token here">
                </div>
                <div class="form-group">
                    <label class="form-label" for="reset-password">New Password</label>
                    <input class="form-input" type="password" id="reset-password" required minlength="8" placeholder="At least 8 characters">
                </div>
                <div class="form-group">
                    <label class="form-label" for="reset-confirm">Confirm Password</label>
                    <input class="form-input" type="password" id="reset-confirm" required minlength="8" placeholder="Re-enter your password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
            </form>

            <p class="auth-footer-link"><a href="login.html">Back to Sign In</a></p>
        </div>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
