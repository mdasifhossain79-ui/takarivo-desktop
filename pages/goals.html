<!DOCTYPE html>
<html lang="en" class="auth-checking">
<head>
    <script src="../js/authGuard.js"></script>
    <script>document.documentElement.classList.remove("auth-checking");</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals — Takarivo</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/budgets-page.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <div class="sidebar-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">Takarivo</div>
            <a class="sidebar-link" href="dashboard.html">Dashboard</a>
            <a class="sidebar-link" href="accounts.html">Accounts</a>
            <a class="sidebar-link" href="transactions.html">Transactions</a>
            <a class="sidebar-link" href="cards.html">Cards</a>
            <a class="sidebar-link" href="budgets.html">Budgets</a>
            <a class="sidebar-link" href="goals.html">Goals</a>
            <a class="sidebar-link" href="reports.html">Reports</a>
            <a class="sidebar-link" href="settings.html">Settings</a>
            <a class="sidebar-link" href="help.html">Help</a>
        </aside>

        <div class="main-content">
            <header class="app-header">
                <button class="menu-toggle btn btn-secondary">☰</button>
                <h2>Goals</h2>
                <button id="logout-btn" class="btn">Logout</button>
            </header>

            <div class="page-body">
                <div class="flex-between mb-lg">
                    <p>Track progress toward your savings goals.</p>
                    <button class="btn btn-primary" id="add-goal-btn">+ Add Goal</button>
                </div>

                <div class="card mb-lg" id="goal-form-card" hidden style="max-width: 480px;">
                    <h3 class="mb-md" id="goal-form-title">Add Goal</h3>
                    <div class="form-banner error" id="goal-form-error"></div>
                    <form id="goal-form">
                        <div class="form-group">
                            <label class="form-label" for="goal-name">Goal Name</label>
                            <input class="form-input" type="text" id="goal-name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="goal-target">Target Amount (৳)</label>
                            <input class="form-input" type="number" step="0.01" min="0.01" id="goal-target" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="goal-saved">Saved So Far (৳)</label>
                            <input class="form-input" type="number" step="0.01" min="0" id="goal-saved" value="0">
                        </div>
                        <div class="flex gap-md">
                            <button type="submit" class="btn btn-primary">Save</button>
                            <button type="button" class="btn btn-secondary" id="goal-cancel-btn">Cancel</button>
                        </div>
                    </form>
                </div>

                <div class="card" id="goals-list"></div>
            </div>
        </div>
    </div>

    <script src="../js/authStorage.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/goals.js"></script>
</body>
</html>
