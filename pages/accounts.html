<!DOCTYPE html>
<html lang="en" class="auth-checking">
<head>
    <script src="../js/authGuard.js"></script>
    <script>document.documentElement.classList.remove("auth-checking");</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts — Takarivo</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <div class="sidebar-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">Takarivo</div>
            <a class="sidebar-link" href="dashboard.html">Dashboard</a>
            <a class="sidebar-link" href="accounts.html">Accounts</a>
            <a class="sidebar-link" href="transactions.html">Transactions</a>
            <a class="sidebar-link" href="cards.html">Cards</a>
            <a class="sidebar-link" href="budgets.html">Budgets</a>
            <a class="sidebar-link" href="goals.html">Goals</a>
            <a class="sidebar-link" href="reports.html">Reports</a>
            <a class="sidebar-link" href="settings.html">Settings</a>
            <a class="sidebar-link" href="help.html">Help</a>
        </aside>

        <div class="main-content">
            <header class="app-header">
                <button class="menu-toggle btn btn-secondary">☰</button>
                <h2>Accounts</h2>
                <button id="logout-btn" class="btn">Logout</button>
            </header>

            <div class="page-body">
                <div class="flex-between mb-lg">
                    <p>Manage your bank accounts and wallets.</p>
                    <button class="btn btn-primary" id="add-account-btn">+ Add Account</button>
                </div>

                <div class="card mb-lg" id="account-form-card" hidden style="max-width: 480px;">
                    <h3 class="mb-md" id="account-form-title">Add Account</h3>
                    <div class="form-banner error" id="account-form-error"></div>
                    <form id="account-form">
                        <div class="form-group">
                            <label class="form-label" for="account-name">Account Name</label>
                            <input class="form-input" type="text" id="account-name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="account-type">Type</label>
                            <select class="form-input" id="account-type" required>
                                <option value="Checking">Checking</option>
                                <option value="Savings">Savings</option>
                                <option value="MFS">MFS (Mobile Financial Services)</option>
                                <option value="Mobile Wallet">Mobile Wallet</option>
                                <option value="Cash">Cash</option>
                            </select>
                            <div id="mfs-providers-container" class="mt-xs" style="display: none;">
                                <div class="item-meta mb-xs" style="font-size: var(--font-size-sm); margin-top: 6px;">Quick select provider:</div>
                                <div class="flex gap-xs" style="flex-wrap: wrap;">
                                    <button type="button" class="btn btn-secondary mfs-chip" data-provider="bKash" style="padding: 4px 10px; font-size: var(--font-size-sm);">bKash</button>
                                    <button type="button" class="btn btn-secondary mfs-chip" data-provider="Nagad" style="padding: 4px 10px; font-size: var(--font-size-sm);">Nagad</button>
                                    <button type="button" class="btn btn-secondary mfs-chip" data-provider="Rocket" style="padding: 4px 10px; font-size: var(--font-size-sm);">Rocket</button>
                                    <button type="button" class="btn btn-secondary mfs-chip" data-provider="Upay" style="padding: 4px 10px; font-size: var(--font-size-sm);">Upay</button>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="account-balance">Balance (৳)</label>
                            <input class="form-input" type="number" step="0.01" id="account-balance" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="account-status">Status</label>
                            <select class="form-input" id="account-status">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                        <div class="flex gap-md">
                            <button type="submit" class="btn btn-primary">Save</button>
                            <button type="button" class="btn btn-secondary" id="account-cancel-btn">Cancel</button>
                        </div>
                    </form>
                </div>

                <div class="card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Account Name</th>
                                <th>Type</th>
                                <th>Balance</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="accounts-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/authStorage.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/accounts.js"></script>
</body>
</html>
