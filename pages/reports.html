<!DOCTYPE html>
<html lang="en" class="auth-checking">
<head>
    <script src="../js/authGuard.js"></script>
    <script>document.documentElement.classList.remove("auth-checking");</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports — Takarivo</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <script src="../js/vendor/chart.umd.js"></script>
</head>
<body>

    <div class="sidebar-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">Takarivo</div>
            <a class="sidebar-link" href="dashboard.html">Dashboard</a>
            <a class="sidebar-link" href="accounts.html">Accounts</a>
            <a class="sidebar-link" href="transactions.html">Transactions</a>
            <a class="sidebar-link" href="cards.html">Cards</a>
            <a class="sidebar-link" href="budgets.html">Budgets</a>
            <a class="sidebar-link" href="goals.html">Goals</a>
            <a class="sidebar-link" href="reports.html">Reports</a>
            <a class="sidebar-link" href="settings.html">Settings</a>
            <a class="sidebar-link" href="help.html">Help</a>
        </aside>

        <div class="main-content">
            <header class="app-header">
                <button class="menu-toggle btn btn-secondary">☰</button>
                <h2>Reports</h2>
                <button id="logout-btn" class="btn">Logout</button>
            </header>

            <div class="page-body">
                <div class="flex-between flex-wrap gap-md mb-lg">
                    <p>Spending and savings for the month you choose.</p>
                    <input class="form-input" type="month" id="report-month" style="width: auto;">
                </div>

                <p class="form-banner error mb-lg" id="report-error"></p>

                <div class="grid grid-auto mb-lg">
                    <div class="card kpi-card">
                        <div class="kpi-label">Income</div>
                        <div class="kpi-value kpi-positive" id="rep-income">৳0</div>
                    </div>
                    <div class="card kpi-card">
                        <div class="kpi-label">Expenses</div>
                        <div class="kpi-value kpi-negative" id="rep-expenses">৳0</div>
                    </div>
                    <div class="card kpi-card">
                        <div class="kpi-label">Net Savings</div>
                        <div class="kpi-value" id="rep-net">৳0</div>
                    </div>
                </div>

                <div class="grid grid-auto">
                    <div class="card">
                        <h3 class="mb-md">Spending by Category</h3>
                        <p id="category-empty" hidden>No expenses recorded for this month.</p>
                        <div class="chart-container" id="category-chart-wrap">
                            <canvas id="category-chart"></canvas>
                        </div>
                    </div>
                    <div class="card">
                        <h3 class="mb-md">6-Month Net Savings</h3>
                        <div class="chart-container">
                            <canvas id="trend-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/authStorage.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/reports.js"></script>
</body>
</html>
